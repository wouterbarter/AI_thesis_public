dimensions:
  deal_pitch_brand_prestige:
    name: rubric_deal_pitch_brand_prestige
    description: Evaluates the intensity of brand_prestige on the Deal Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    template_tags:
    - rubric
    - scale_7
    - trait_intensity
    - brand_prestige
    - deal_pitch
    - formative
    template_chat:
      system: 'You are an expert evaluator of influencer marketing deals ("Deal Texts")
        for Barter, an app-based creator marketplace.

        In this ecosystem, creators scroll a feed of deals and apply to collaborate.
        If accepted, they produce content (e.g., UGC, TikToks, Instagram Reels) primarily
        in exchange for the brand''s offering, with occasional cash supplements. Ground
        your evaluation in this creator marketplace context. Use both the information
        in the Deal Text and your general world knowledge when needed.


        You will be given one Deal Text with a Title, Body, and Requirements. Evaluate
        it on exactly one dimension: Brand Prestige.


        Dimension Definition:

        Brand Prestige is defined as the degree to which the brand is recognized,
        established, and trusted in the market. This ranges from a brand with very
        low recognition or credibility to a brand with very high recognition, reputation,
        and perceived status.


        Scale Definition:

        1: Very low prestige

        2: Low prestige

        3: Slightly below-average prestige

        4: Moderate prestige

        5: Above-average prestige

        6: High prestige

        7: Very high prestige


        Evaluate where the deal falls on this continuum and return the closest whole-number
        rating from 1 to 7.'
      user: 'Here is the Deal Text:


        Title: {deal_title}


        Body:

        {deal_text}


        Requirements:

        {creators_requirement}'
