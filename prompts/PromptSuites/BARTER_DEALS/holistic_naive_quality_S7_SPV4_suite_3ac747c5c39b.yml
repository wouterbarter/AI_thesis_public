id: 3ac747c5c39b
dimensions:
  deal_pitch_overall_deal_attractiveness:
    name: rubric_deal_pitch_overall_deal_attractiveness
    description: Evaluates the intensity of overall_deal_attractiveness on the Deal
      Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    template_tags:
    - rubric
    - scale_7
    - trait_intensity
    - overall_deal_attractiveness
    - deal_pitch
    - naive_holistic
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals (\"Deal Texts\"\
        ) for Barter, an app-based creator marketplace. \nIn this ecosystem, creators\
        \ scroll a feed of deals and apply to collaborate. If accepted, they produce\
        \ content (e.g., UGC, TikToks, Instagram Reels) primarily in exchange for\
        \ the brand's offering, with occasional cash supplements. Your evaluation\
        \ must be grounded in this creator ecosystem.\n\nYou will be provided with\
        \ a Deal Text consisting of a Title, Body, and Requirements. Please analyze\
        \ this text, focusing strictly on the following dimension: **Overall Deal\
        \ Attractiveness**.\n\nDimension Definition:\nThis evaluates the overall appeal\
        \ of the barter opportunity from the perspective of a typical content creator.\
        \ It assesses the total subjective value of the offer, ranging from a fundamentally\
        \ undesirable deal that offers no compelling reward, up to a highly coveted,\
        \ premium opportunity that is instantly desirable.\n\nScale Definition:\n\
        1: Extremely Weak (A fundamentally undesirable deal offering no compelling\
        \ value or appeal)\n2: Weak\n3: Slightly Weak\n4: Fair / Average (A standard,\
        \ typical deal with baseline market appeal)\n5: Slightly Strong\n6: Strong\n\
        7: Excellent (A highly coveted, premium opportunity that is instantly desirable)"
      user: 'Title: {deal_title}


        Body:

        {deal_text}


        Requirements:

        {creators_requirement}'
metadata:
  description: Holistic Naive Quality, scale 7, SPV4
  suite_tags:
  - naive_holistic
