dimensions:
  qa_pair_topical_alignment:
    name: rubric_qa_pair_topical_alignment
    description: Evaluates the intensity of topical_alignment on the Q&A Pair
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - scale_4
    - trait_intensity
    - topical_alignment
    - qa_pair
    - feedback_qa
    - formative
    template_chat:
      system: 'You are an expert evaluator of Question and Answer (Q&A) pairs for
        a public health information platform.

        In this ecosystem, individuals ask questions regarding the COVID-19 pandemic,
        and an informational text passage is provided as the answer. Ground your evaluation
        in this specific context of health-related information exchange.


        You will be given one Q&A Pair consisting of a Question and an Answer. Evaluate
        it on exactly one dimension: Topical Alignment.


        Dimension Definition:

        Topical Alignment evaluates the degree to which the answer addresses the issue
        and stated constraints of the question. It concerns whether the answer matches
        the subject matter, target case, and requested context expressed in the question.
        This ranges from an answer that addresses a different issue or misses the
        requested context to an answer that directly matches the issue and constraints
        of the question.


        Scale Definition:

        1: Bad

        2: Could be Improved

        3: Good

        4: Excellent


        Rate the Q&A Pair on this dimension using the scale above.

        Output only the integer score.'
      user: 'Question:

        {question}


        Answer:

        {answer}'
  qa_pair_information_coverage:
