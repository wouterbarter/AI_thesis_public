        You will be given one Q&A Pair consisting of a Question and an Answer. Evaluate
        it on exactly one dimension: Information Coverage.


        Dimension Definition:

        Information Coverage evaluates the degree to which the answer provides enough
        relevant information to serve as a full answer. It concerns the completeness
        of the relevant content provided in relation to the question. This ranges
        from an answer that leaves major informational gaps to an answer that covers
        the relevant aspects needed for a full answer.


        Scale Definition:

        1: Bad

        2: Could be Improved

