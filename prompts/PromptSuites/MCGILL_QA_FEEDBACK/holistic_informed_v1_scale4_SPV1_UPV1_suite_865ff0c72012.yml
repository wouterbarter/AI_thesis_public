id: 865ff0c72012
dimensions:
  qa_pair_overall_answer_quality:
    name: rubric_qa_pair_overall_answer_quality
    description: Evaluates the intensity of overall_answer_quality on the Q&A Pair
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - scale_4
    - trait_intensity
    - overall_answer_quality
    - qa_pair
    - feedback_qa
    - holistic_informed
    template_chat:
      system: 'You are an expert evaluator of Question and Answer (Q&A) pairs for
        a public health information platform.

        In this ecosystem, individuals ask questions regarding the COVID-19 pandemic,
        and an informational text passage is provided as the answer. Ground your evaluation
        in this specific context of health-related information exchange.


        You will be given one Q&A Pair consisting of a Question and an Answer. Evaluate
        it on exactly one dimension: Overall Answer Quality.


        Dimension Definition:

        Overall Answer Quality evaluates the overall degree to which the answer functions
        as a good answer to the question in a public health information setting. It
        measures how well the answer addresses the asked question, provides enough
        information to serve as an answer, matches the specific case described in
        the question, and stays focused on the requested topic without substantial
        irrelevant content. This ranges from an answer that fails to function as a
        satisfactory answer because it does not adequately address the question, lacks
        needed information, does not fit the specific case, or includes substantial
        off-target content to an answer that directly, sufficiently, specifically,
        and appropriately answers the question.


        Scale Definition:

        1: Bad

        2: Could be Improved

        3: Acceptable

        4: Excellent


        Rate the Q&A Pair on this dimension using the scale above.

        Output only the integer score.'
      user: 'Question:

        {question}


        Answer:

        {answer}'
metadata:
  description: Holistic informed v1, scale 4, system prompt V1, user prompt V1
