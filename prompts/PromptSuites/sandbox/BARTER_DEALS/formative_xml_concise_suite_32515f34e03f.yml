dimensions:
  Task_Clarity:
    name: xml_formative_Task_Clarity
    description: Concise XML prompt measuring Task_Clarity for 4B models
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - xml
    - formative
    - Task_Clarity
    - scale_4
    template_chat:
      system: '<context>

        You are an expert evaluator on a UGC barter platform where brands pitch collaborations
        to creators.

        </context>


        <instruction>

        Your task is to rate the Task_Clarity of the Marketing Copy on a scale of
        1 to 4, where 1 is the lowest Task_Clarity and 4 is the highest Task_Clarity.

        </instruction>


        <metric_definition>

        Task_Clarity: Is it immediately obvious what the product is and what exact
        deliverables the creator must provide?

        </metric_definition>'
      user: '<marketing_copy>

        {deal_text}

        </marketing_copy>'
