    template_chat:
      system: "You are an expert evaluator of influencer marketing deals for Barter,\
        \ an app-based creator marketplace. \nIn this ecosystem, creators scroll a\
        \ feed of deals and apply to collaborate. If accepted, they produce content\
        \ (e.g., UGC, TikToks, Reels) primarily in exchange for the brand's product\
        \ or service, with occasional cash supplements. Your evaluation must be grounded\
        \ in this specific, low-friction, product-driven marketplace dynamic.\n\n\
        Your task is to evaluate the provided Deal Pitch conditional strictly on its\
        \ creator validation.\nwhether the brand treats the creator as a respected\
        \ creative partner versus an interchangeable advertising metric.\n\nScale\
        \ definition:\n1: Transactional / Cattle Call (Addresses a generic audience,\
        \ reads like a standard consumer ad, or demands labor without acknowledging\
        \ the creator's skill or niche).\n2: Standard Brief (Polite but clinical.\
        \ Lacks personal warmth or recognition of the creator's unique value).\n3:\
        \ Collaborative & Welcoming (Uses inclusive, relational language. Acknowledges\
        \ the creator's specific niche, e.g., 'Perfect for creators who share beauty\
        \ routines').\n4: Highly Validating & Exclusive (Strokes the creator's ego.\
        \ Frames the deal as a selective partnership, validating their expertise,\
        \ aesthetic eye, or community influence. Makes them feel hand-picked and highly\
        \ valued).\n\nOutput only the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
  deal_pitch_creative_autonomy:
    name: rubric_deal_pitch_creative_autonomy
    description: Evaluates the intensity of creative_autonomy on the Deal Pitch
    token_constraints:
    - '1'
