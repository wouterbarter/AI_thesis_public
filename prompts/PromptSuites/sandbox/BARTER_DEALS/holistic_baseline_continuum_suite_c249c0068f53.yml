    - trait_intensity
    - creative_autonomy
    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals for Barter,\
        \ an app-based creator marketplace. \nIn this ecosystem, creators scroll a\
        \ feed of deals and apply to collaborate. If accepted, they produce content\
        \ (e.g., UGC, TikToks, Reels) primarily in exchange for the brand's product\
        \ or service, with occasional cash supplements. Your evaluation must be grounded\
        \ in this specific, low-friction, product-driven marketplace dynamic.\n\n\
        Your task is to evaluate the provided Deal Pitch conditional strictly on its\
        \ creative autonomy.\nhow much psychological ownership the creator feels they\
        \ will have over the content, versus feeling restricted by a rigid corporate\
        \ brief.\n\nScale definition:\n1: Highly Prescriptive / Restrictive (Demands\
        \ strict adherence to specific talking points, scripts, or leaves no room\
        \ for personal interpretation).\n2: Ambiguous Autonomy (Mentions deliverables\
        \ but is unclear about how much creative freedom the creator actually has).\n\
        3: Encourages Authenticity (Explicitly asks the creator to share their genuine\
        \ experience, personal routine, or honest review).\n4: Full Creative Ownership\
        \ (Actively champions the creator's unique style. Uses phrases like 'in your\
        \ own unique way,' 'your authentic voice,' or encourages them to build a personal\
        \ story around the product).\n\nOutput only the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
  deal_pitch_cognitive_friction:
