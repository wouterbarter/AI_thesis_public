id: c249c0068f53
dimensions:
  deal_pitch_aspirational_framing:
    name: rubric_deal_pitch_aspirational_framing
    description: Evaluates the intensity of aspirational_framing on the Deal Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    template_tags:
    - rubric
    - scale_7
    - trait_intensity
    - aspirational_framing
    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals for Barter,\
        \ an app-based creator marketplace. \nIn this ecosystem, creators scroll a\
        \ feed of deals and apply to collaborate. If accepted, they produce content\
        \ (e.g., UGC, TikToks, Reels) primarily in exchange for the brand's product\
        \ or service, with occasional cash supplements. Your evaluation must be grounded\
        \ in this specific, low-friction, product-driven marketplace dynamic.\n\n\
        Your task is to evaluate the provided Deal Pitch conditional strictly on its\
        \ aspirational framing.\nhow well the text elevates a mundane or standard\
        \ product into a highly desirable, aesthetic lifestyle experience that a creator\
        \ would want to associate with their personal brand.\n\nScale definition:\n\
        1: Dry & Functional (Describes the product strictly by its physical traits\
        \ or utility, reading like a catalog entry. E.g., 'We sell scented cleaning\
        \ products').\n2: Mildly Appealing (Hints at a positive outcome or feeling,\
        \ but lacks immersive storytelling or strong lifestyle cues).\n3: Lifestyle-Oriented\
        \ (Actively frames the product within a relatable, aesthetically pleasing\
        \ scenario, e.g., 'Perfect for your cozy autumn evenings').\n4: Highly Aspirational\
        \ (Masterfully sells a vibe, feeling, or elevated status. It makes the product\
        \ feel like an essential part of an idealized, 'high-end' or romanticized\
        \ lifestyle, making the creator want to live that narrative).\n\nOutput only\
        \ the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
