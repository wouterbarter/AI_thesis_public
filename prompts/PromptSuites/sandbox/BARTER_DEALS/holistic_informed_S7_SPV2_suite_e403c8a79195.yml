id: e403c8a79195
dimensions:
  deal_pitch_informed_deal_attractiveness:
    name: rubric_deal_pitch_informed_deal_attractiveness
    description: Evaluates the intensity of informed_deal_attractiveness on the Deal
      Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    template_tags:
    - rubric
    - scale_7
    - trait_intensity
    - informed_deal_attractiveness
    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals for Barter,\
        \ an app-based creator marketplace. \nIn this ecosystem, creators scroll a\
        \ feed of deals and apply to collaborate. If accepted, they produce content\
        \ (e.g., UGC, TikToks, Reels) primarily in exchange for the brand's product\
        \ or service, with occasional cash supplements. Your evaluation must be grounded\
        \ in this specific, low-friction, product-driven marketplace dynamic.\n\n\
        Your task is to evaluate the provided Deal Pitch conditional strictly on its\
        \ informed deal attractiveness.\nThis evaluates the overall appeal of the\
        \ barter opportunity from the perspective of a typical content creator. To\
        \ determine this overall attractiveness, you must simultaneously consider\
        \ and synthesize six underlying factors into a single judgment:\n1. Brand\
        \ Recognition: How established the company is.\n2. Creator Brand Alignment:\
        \ How well the product fits an aspirational creator aesthetic.\n3. Product\
        \ Universality: The broad mass-market appeal of the actual product.\n4. Workload\
        \ Volume: The amount of effort and content required from the creator.\n5.\
        \ Call-to-Action Strength: The clarity and persuasive power of the next steps.\n\
        6. Value Proposition Clarity: How well the exchange is articulated.\n\nAssess\
        \ the total subjective value of the offer based on these aggregated factors\u2014\
        ranging from a fundamentally undesirable deal (Extremely Weak), up to a highly\
        \ coveted, premium opportunity (Excellent).\n\nScale definition:\n1: Extremely\
        \ Weak\n2: Weak\n3: Slightly Weak\n4: Fair / Average\n5: Slightly Strong\n\
        6: Strong\n7: Excellent\n\nOutput only the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
metadata:
  description: Holistic Informed Baseline, scale 7, SPV2
  suite_tags:
  - informed_deal_attractiveness
