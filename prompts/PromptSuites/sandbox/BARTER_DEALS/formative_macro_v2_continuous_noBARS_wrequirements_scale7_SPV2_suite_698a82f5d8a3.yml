dimensions:
  deal_pitch_holistic_reward_attractiveness:
    name: rubric_deal_pitch_holistic_reward_attractiveness
    description: Evaluates the intensity of holistic_reward_attractiveness on the
      Deal Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    template_tags:
    - rubric
    - scale_7
    - trait_intensity
    - holistic_reward_attractiveness
    - deal_pitch
    - informed_holistic
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals for Barter,\
        \ an app-based creator marketplace. \nIn this ecosystem, creators scroll a\
        \ feed of deals and apply to collaborate. If accepted, they produce content\
        \ (e.g., UGC, TikToks, Reels) primarily in exchange for the brand's product\
        \ or service, with occasional cash supplements. Your evaluation must be grounded\
        \ in this specific, low-friction, product-driven marketplace dynamic.\n\n\
        Your task is to evaluate the provided Deal Pitch conditional strictly on its\
        \ holistic reward attractiveness.\nEvaluate the overall attractiveness and\
        \ subjective desirability of the reward from the perspective of a professional\
        \ creator. Consider the 'Gestalt' of the offering: does the combination of\
        \ the brand's reputation, the product's value, and its aesthetic appeal feel\
        \ like a highly desirable opportunity?\n\nScale definition:\n1: Extremely\
        \ Unattractive Reward\n2: Very Unattractive\n3: Unattractive\n4: Neutral/Average\
        \ Reward\n5: Attractive\n6: Very Attractive\n7: Highly Desirable/Premium Reward\n\
        \nOutput only the integer score."
      user: 'Title: {deal_title}


        Body:

        {deal_text}


        Requirements:

        {creators_requirement}'
