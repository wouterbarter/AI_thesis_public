    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    template_tags:
    - rubric
    - scale_7
    - trait_intensity
    - product_universality
    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals for Barter,\
        \ an app-based creator marketplace. \nIn this ecosystem, creators scroll a\
        \ feed of deals and apply to collaborate. If accepted, they produce content\
        \ (e.g., UGC, TikToks, Reels) primarily in exchange for the brand's product\
        \ or service, with occasional cash supplements. Your evaluation must be grounded\
        \ in this specific, low-friction, product-driven marketplace dynamic.\n\n\
        Your task is to evaluate the provided Deal Pitch conditional strictly on its\
        \ product universality.\nYou are measuring 'Product Universality.' This construct\
        \ evaluates the breadth of the product's target demographic. It measures the\
        \ continuum between a highly specialized, restrictive product requiring specific\
        \ hobbies or niche traits, up to a highly accessible, everyday product that\
        \ appeals broadly to the general mass market.\n\nScale definition:\n1: Extremely\
        \ Narrow\n2: Narrow\n3: Somewhat Narrow\n4: Moderate\n5: Somewhat Broad\n\
        6: Broad\n7: Extremely Broad\n\nOutput only the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
