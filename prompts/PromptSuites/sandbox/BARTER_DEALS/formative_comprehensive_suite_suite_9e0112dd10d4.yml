dimensions:
  deal_title_product_universality:
    name: rubric_deal_title_product_universality
    description: Evaluates application propensity conditional on product_universality
      for Deal Title
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - deal_title
    - product_universality
    - scale_4
    - propensity
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals. Deals are\
        \ posted by companies and are targeted at creators, who are expected to make\
        \ content in exchange for the product specified in the deal. \nYour task is\
        \ to evaluate how likely the creator is to apply to the deal conditional strictly\
        \ on its product universality.\nThis measures how broad the appeal of the\
        \ product or service is to a general audience versus a highly niche demographic.\n\
        \nScale definition:\n1: The creator is highly unlikely to apply.\n2: The creator\
        \ is somewhat unlikely to apply.\n3: The creator is somewhat likely to apply.\n\
        4: The creator is highly likely to apply.\n\nOutput only the integer score."
      user: 'Deal Title:

        {deal_title}'
