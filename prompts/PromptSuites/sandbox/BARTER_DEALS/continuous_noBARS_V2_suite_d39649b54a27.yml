    - workload_volume
    - creators_requirement
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals. \nYour task\
        \ is to evaluate the provided Creator Requirements conditional strictly on\
        \ its workload volume.\nThis measures You are measuring 'Workload Volume.'\
        \ This construct evaluates the sheer magnitude of content creation, deliverables,\
        \ and ongoing effort demanded from the creator. It measures the continuum\
        \ between a virtually frictionless, minimal-effort request (e.g., a single\
        \ simple story or quick amplification), up to an excessively high-friction\
        \ commitment requiring massive ongoing deliverable volumes, complex production,\
        \ or intensive long-term coordination.\n\nScale definition:\n1: Very Low\n\
        2: Low\n3: High\n4: Very High\n\nOutput only the integer score."
