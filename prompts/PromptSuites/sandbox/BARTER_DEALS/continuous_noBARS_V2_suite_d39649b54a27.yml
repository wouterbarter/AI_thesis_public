        \nScale definition:\n1: Weak\n2: Fair\n3: Good\n4: Excellent\n\nOutput only\
        \ the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
  deal_pitch_product_universality:
