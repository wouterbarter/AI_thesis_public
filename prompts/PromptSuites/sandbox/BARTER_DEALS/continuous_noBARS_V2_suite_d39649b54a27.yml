    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals. \nYour task\
        \ is to evaluate the provided Deal Pitch conditional strictly on its call\
        \ to action strength.\nThis measures You are measuring 'Call to Action Strength.'\
        \ This construct evaluates the urgency, explicitness, and compelling nature\
