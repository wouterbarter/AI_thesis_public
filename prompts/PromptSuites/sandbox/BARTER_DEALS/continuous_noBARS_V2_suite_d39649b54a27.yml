id: d39649b54a27
dimensions:
  deal_pitch_brand_recognition:
    name: rubric_deal_pitch_brand_recognition
    description: Evaluates the intensity of brand_recognition on the Deal Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - scale_4
    - trait_intensity
    - brand_recognition
    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals. \nYour task\
        \ is to evaluate the provided Deal Pitch conditional strictly on its brand\
        \ recognition.\nThis measures You are measuring 'Brand Recognition.' This\
        \ construct evaluates the inherent brand equity and public awareness of the\
        \ specific brand or company, independent of the actual product category. It\
        \ measures the continuum between a completely anonymous, generic, or newly\
        \ founded entity with zero existing social proof, up to a universally recognized,\
        \ ubiquitous household name that instantly lends massive mainstream credibility\
        \ to the creator.\n\nScale definition:\n1: Weak\n2: Fair\n3: Good\n4: Excellent\n\
        \nOutput only the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
  deal_pitch_creator_brand_alignment:
    name: rubric_deal_pitch_creator_brand_alignment
    description: Evaluates the intensity of creator_brand_alignment on the Deal Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - scale_4
    - trait_intensity
    - creator_brand_alignment
    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals. \nYour task\
        \ is to evaluate the provided Deal Pitch conditional strictly on its creator\
        \ brand alignment.\nThis measures You are measuring 'Creator Brand Alignment.'\
        \ This construct evaluates the degree to which the product or service naturally\
        \ integrates into the aspirational aesthetic and lifestyle identities typical\
        \ of content creators (e.g., beauty, fashion, culinary, travel, fitness).\
        \ It measures the continuum between a dry, highly corporate, or mundane utility\
        \ product that inherently clashes with a creator's personal brand, up to a\
        \ highly photogenic, trendy, and aspirational product that actively elevates\
        \ it.\n\nScale definition:\n1: Weak\n2: Fair\n3: Good\n4: Excellent\n\nOutput\
        \ only the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
  deal_pitch_value_proposition_clarity:
    name: rubric_deal_pitch_value_proposition_clarity
    description: Evaluates the intensity of value_proposition_clarity on the Deal
      Pitch
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - scale_4
    - trait_intensity
    - value_proposition_clarity
    - deal_pitch
    template_chat:
      system: "You are an expert evaluator of influencer marketing deals. \nYour task\
        \ is to evaluate the provided Deal Pitch conditional strictly on its value\
        \ proposition clarity.\nThis measures You are measuring 'Value Proposition\
        \ Clarity.' This construct evaluates how explicitly the text communicates\
        \ the exact reward and core benefit of the collaboration to the creator. It\
        \ measures the continuum between a highly ambiguous, buried, or obscured value\
        \ exchange requiring the reader to guess the benefits, up to a highly transparent,\
        \ sharply formatted pitch where the precise rewards and collaboration terms\
        \ are immediately obvious and focal.\n\nScale definition:\n1: Weak\n2: Fair\n\
        3: Good\n4: Excellent\n\nOutput only the integer score."
      user: 'Deal Pitch:

        Title: {deal_title}


        Body:

        {deal_text}'
  deal_pitch_call_to_action_strength:
