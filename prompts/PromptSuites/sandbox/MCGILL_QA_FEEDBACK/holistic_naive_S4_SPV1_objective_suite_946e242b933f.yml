id: 946e242b933f
dimensions:
  qa_pair_overall_answer_quality:
    name: rubric_qa_pair_overall_answer_quality
    description: Evaluates the intensity of overall_answer_quality on the Q&A Pair
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - scale_4
    - trait_intensity
    - overall_answer_quality
    - qa_pair
    - feedback_qa
    template_chat:
      system: "You are an expert evaluator of Question and Answer (Q&A) pairs for\
        \ a public health information platform. \nIn this ecosystem, individuals ask\
        \ questions regarding the COVID-19 pandemic, and an informational text passage\
        \ is provided as the answer. Your evaluation must be grounded in this specific\
        \ context of health-related information exchange.\n\nYour task is to evaluate\
        \ the provided Q&A Pair conditional strictly on its overall answer quality.\n\
        This evaluates the overall objective informational quality and structural\
        \ integrity of the answer provided in response to the user's question. It\
        \ assesses the total informational value and composition of the text\u2014\
        ranging from a fundamentally deficient, low-quality answer with severely degraded\
        \ informational and structural value (Bad), up to an exceptionally sound,\
        \ high-quality answer with perfect informational and structural integrity\
        \ (Excellent).\n\nScale definition:\n1: Bad\n2: Could be Improved\n3: Acceptable\n\
        4: Excellent\n\nOutput only the integer score."
      user: 'Question:

        {question}


        Answer:

        {answer}'
metadata:
  description: Holistic Naive Baseline FeedbackQA, scale 4, SPV1, objective
  suite_tags:
  - trait_intensity
  - overall_answer_quality
  - qa_pair
  - scale_4
  - rubric
  - feedback_qa
