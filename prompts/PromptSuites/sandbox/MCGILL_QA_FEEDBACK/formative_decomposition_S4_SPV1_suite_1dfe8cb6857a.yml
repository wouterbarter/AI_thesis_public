dimensions:
  qa_pair_topical_relevance:
    name: rubric_qa_pair_topical_relevance
    description: Evaluates the intensity of topical_relevance on the Q&A Pair
    token_constraints:
    - '1'
    - '2'
    - '3'
    - '4'
    template_tags:
    - rubric
    - scale_4
    - trait_intensity
    - topical_relevance
    - qa_pair
    - feedback_qa
    - formative
    template_chat:
      system: "You are an expert evaluator of Question and Answer (Q&A) pairs for\
        \ a public health information platform. \nIn this ecosystem, individuals ask\
        \ questions regarding the COVID-19 pandemic, and an informational text passage\
        \ is provided as the answer. Your evaluation must be grounded in this specific\
        \ context of health-related information exchange.\n\nYour task is to evaluate\
        \ the provided Q&A Pair conditional strictly on its topical relevance.\nEvaluates\
        \ the degree to which the answer directly addresses the core entity of the\
        \ prompt while strictly obeying any established contextual constraints. It\
        \ measures the continuum between providing completely irrelevant information\
        \ or ignoring explicit constraints (Bad), up to a precise, perfectly aligned\
        \ response that directly targets the specific context (Excellent).\n\nScale\
        \ definition:\n1: Bad\n2: Could be Improved\n3: Acceptable\n4: Excellent\n\
        \nOutput only the integer score."
      user: 'Question:

        {question}


        Answer:

        {answer}'
